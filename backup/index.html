<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>ACCESS POINT</title>
    <style>
      /* ==========================================================================
         1. THEME VARIABLES & GLOBAL RESET
         ========================================================================== */
      :root {
        --bg: #0b1120;
        --bg-elev: #111827;
        --card: #162033;
        --card-hover: #1d2942;
        --border: #24324d;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.16);
        --ok: #22c55e;
        --err: #ef4444;
        --warn: #f59e0b;
        --star: #fbbf24;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        --radius: 14px;
      }

      [data-theme="amoled"] {
        --bg: #000000;
        --bg-elev: #09090b;
        --card: #121215;
        --card-hover: #1a1a1f;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }

      [data-theme="light"] {
        --bg: #f1f5f9;
        --bg-elev: #ffffff;
        --card: #ffffff;
        --card-hover: #f8fafc;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #0284c7;
        --accent-soft: rgba(2, 132, 199, 0.12);
        --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }

      html,
      body,
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        line-height: 1.45;
        overflow-x: hidden;
      }

      body.modal-open {
        overflow: hidden !important;
        touch-action: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ==========================================================================
         2. HEADER & NAVIGATION BAR
         ========================================================================== */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--bg-elev);
        background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: auto;
        min-width: 0;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .brand h1 {
        font-size: 1.08rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .brand-sub {
        font-size: 0.75rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 0.71rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
      }
      .dot.online {
        background: var(--ok);
      }
      .dot.offline {
        background: var(--err);
      }
      .dot.checking {
        background: var(--warn);
        animation: pulse 1s infinite;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .seg-toggle {
        display: inline-flex;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 2px;
      }

      .seg-btn {
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .seg-btn.icon-only {
        padding: 5px 8px;
      }

      .seg-btn.active {
        background: var(--accent);
        color: #031525;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
        text-decoration: none;
        transition: 0.15s;
        flex-shrink: 0;
      }

      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .icon-btn.spinning svg {
        animation: spin 0.8s linear infinite;
      }

      /* Search Bar */
      .search-wrap {
        position: relative;
        flex: 1 1 240px;
        max-width: 340px;
      }

      .search-wrap svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        height: 36px;
        padding: 0 32px 0 34px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 0.85rem;
        outline: none;
        transition: 0.15s;
      }

      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .search-clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
        padding: 4px;
        display: none;
      }

      /* ==========================================================================
         3. MAIN CONTAINER, FAVORITES & SHORTCUTS
         ========================================================================== */
      .container {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
        flex: 1;
      }

      .fav-section,
      .shortcut-section {
        margin-bottom: 20px;
      }

      .section-label {
        font-size: 0.74rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .fav-strip {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 8px 6px 10px 6px;
        margin: -6px -6px 0 -6px;
        -webkit-overflow-scrolling: touch;
      }

      .fav-chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
        font-size: 0.84rem;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          background 0.18s ease,
          box-shadow 0.18s ease;
        flex-shrink: 0;
        user-select: none;
      }

      .fav-chip:hover,
      .fav-chip:focus-visible,
      .fav-chip:active {
        border-color: var(--chip-color, var(--accent));
        background: var(--card-hover);
        transform: translateY(-1px);
        box-shadow:
          0 4px 14px var(--accent-soft),
          0 0 10px
            color-mix(
              in srgb,
              var(--chip-color, var(--accent)) 32%,
              transparent
            );
        outline: none;
      }

      .shortcut-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 12px;
      }

      .shortcut-card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        user-select: none;
        transition: 0.18s ease;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .shortcut-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 4px;
        background: var(--sc-color, var(--accent));
        opacity: 0.55;
        transition: 0.18s ease;
      }

      .shortcut-card.on {
        border-color: var(--sc-color, var(--ok));
        background: color-mix(
          in srgb,
          var(--sc-color, var(--ok)) 10%,
          var(--card)
        );
      }

      .shortcut-card.on::before {
        opacity: 1;
        background: var(--sc-color, var(--ok));
      }

      .shortcut-card:hover {
        transform: translateY(-1px);
        border-color: var(--sc-color, var(--accent));
      }

      .sc-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .sc-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: color-mix(
          in srgb,
          var(--sc-color, var(--accent)) 16%,
          transparent
        );
        color: var(--sc-color, var(--accent));
      }

      .sc-title {
        font-size: 0.9rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .sc-title-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sc-sub {
        font-size: 0.72rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sc-pill {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-muted);
        flex-shrink: 0;
        transition: 0.18s;
      }

      .shortcut-card.on .sc-pill {
        background: rgba(34, 197, 94, 0.16);
        border-color: var(--ok);
        color: var(--ok);
      }

      .shortcut-card.busy .sc-pill {
        color: var(--warn);
        border-color: var(--warn);
      }

      /* ==========================================================================
         4. GROUPS & DEVICE CARDS (GRID / COMPACT VIEW)
         ========================================================================== */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-bottom: 12px;
      }

      .group-block {
        margin-bottom: 24px;
      }

      .group-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }

      .group-bar {
        width: 4px;
        height: 16px;
        border-radius: 4px;
      }

      .group-title {
        font-size: 0.92rem;
        font-weight: 700;
      }

      .tab-count {
        font-size: 0.7rem;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
      }

      .device-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
        gap: 14px;
      }

      .device-grid.list-view {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          background 0.16s ease,
          box-shadow 0.16s ease;
        box-shadow: var(--shadow);
        overflow: hidden;
        cursor: pointer;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--card-accent, var(--accent));
      }

      .card:hover {
        transform: translateY(-1px);
        background: var(--card-hover);
        border-color: var(--card-accent, var(--accent));
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .dev-icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: var(--accent-soft);
        background: color-mix(
          in srgb,
          var(--card-accent, var(--accent)) 15%,
          transparent
        );
        color: var(--card-accent, var(--accent));
      }

      .dev-info {
        flex: 1;
        min-width: 0;
      }

      .dev-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dev-name {
        font-size: 0.96rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dev-meta {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .fav-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px;
        margin: -4px -4px 0 0;
        border-radius: 8px;
        display: grid;
        place-items: center;
        transition: 0.15s;
        flex-shrink: 0;
      }

      .fav-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--star);
      }
      .fav-btn.active {
        color: var(--star);
      }

      .card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }

      .addr-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 4px 8px;
        border-radius: 7px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: copy;
        transition: 0.15s;
      }

      .addr-pill:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      .card-links {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        flex-shrink: 0;
      }

      .mini-btn {
        font-size: 0.73rem;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--bg-elev);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
      }

      .mini-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Compact List View Overrides */
      .list-view .card {
        flex-direction: row;
        align-items: center;
        padding: 10px 14px;
      }
      .list-view .card::before {
        width: 3px;
        height: 100%;
        right: auto;
      }
      .list-view .card-top {
        flex: 1;
        align-items: center;
        min-width: 0;
      }
      .list-view .dev-icon {
        width: 36px;
        height: 36px;
      }
      .list-view .card-bottom {
        border-top: none;
        padding-top: 0;
        flex-shrink: 0;
      }

      /* Empty State */
      .empty {
        text-align: center;
        padding: 48px 16px;
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
      }

      .empty h3 {
        color: var(--text);
        margin-bottom: 6px;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 14px;
        padding: 9px 16px;
        border-radius: 10px;
        background: var(--accent);
        color: #031525;
        font-weight: 700;
        font-size: 0.85rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }

      /* ==========================================================================
         5. MODALS, AUTH OVERLAY, FOOTER & TOAST
         ========================================================================== */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 60;
      }
      .modal-backdrop.open {
        display: flex;
      }
      .modal {
        width: 100%;
        max-width: 580px;
        max-height: 88vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      /* Auth Modal Controls */
      .pin-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 90;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .pin-card {
        width: 100%;
        max-width: 370px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label {
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--text-muted);
      }
      .input {
        width: 100%;
        height: 38px;
        padding: 0 11px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 0.85rem;
        outline: none;
      }
      .input:focus {
        border-color: var(--accent);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 0.83rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 0.76rem;
        border-radius: 8px;
      }
      .btn-danger {
        border-color: rgba(239, 68, 68, 0.4);
        color: var(--err);
      }
      .meter-bar {
        width: 100%;
        height: 8px;
        background: var(--bg);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .meter-fill {
        height: 100%;
        background: var(--accent);
        transition: width 0.15s;
      }

      /* Footer */
      footer {
        border-top: 1px solid var(--border);
        background: var(--bg-elev);
        padding: 14px 16px;
        font-size: 0.76rem;
        color: var(--text-muted);
        margin-top: auto;
      }

      .footer-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
      }

      .footer-credit {
        font-size: 0.8rem;
        color: var(--text);
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .footer-credit strong,
      .footer-credit .brand-tag {
        font-weight: 700;
      }

      .footer-telemetry {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.74rem;
        color: var(--text-muted);
      }

      .sep {
        opacity: 0.45;
        user-select: none;
      }

      .footer-link {
        color: var(--accent);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.74rem;
        font-weight: 600;
        text-decoration: none;
        padding: 2px 4px;
      }
      .footer-link:hover {
        opacity: 0.85;
      }

      /* Toast & Backdrop */
      .toast-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 98;
      }
      .toast-backdrop.show {
        opacity: 1;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--text);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 600;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: 0.25s ease;
        z-index: 100;
        max-width: 92vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ==========================================================================
         3. CORE UTILITIES & CRYPTO HELPERS
         ========================================================================== */
      function escapeHtml(str) {
        return String(str || "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }

      function svgIcon(name, size = 20) {
        const path = ICONS[name] || ICONS.chip;
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        const bg = document.getElementById("toastBackdrop");
        t.textContent = msg;
        t.classList.add("show");
        bg.classList.add("show");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => {
          t.classList.remove("show");
          bg.classList.remove("show");
        }, 2200);
      }

      function syncModalScrollLock() {
        const hasOpenModal = !!document.querySelector(".modal-backdrop.open");
        const authOpen =
          document.getElementById("authModal")?.style.display === "flex";
        document.body.classList.toggle("modal-open", hasOpenModal || authOpen);
      }

      function rssiToPercent(dbm) {
        const val = Number(dbm);
        if (isNaN(val)) return 0;
        return Math.max(0, Math.min(100, Math.round(((val + 92) / 50) * 100)));
      }

      function formatRssiText(dbm) {
        const pct = rssiToPercent(dbm);
        return `WiFi: ${dbm} dBm (${pct}%)`;
      }

      function cleanHostInput(h) {
        return String(h || "")
          .trim()
          .replace(/^https?:\/\//i, "")
          .replace(/\/+$/, "");
      }

      function buildTargetUrl(dev, customPath = null) {
        if (!dev) return "#";
        const host =
          config.settings.preferMdns && dev.mdns
            ? dev.mdns
            : dev.ip || dev.mdns;
        const cleanHost = cleanHostInput(host);
        if (!cleanHost) return "#";
        const portPart =
          dev.port && Number(dev.port) !== 80 ? `:${dev.port}` : "";
        let path = customPath !== null ? customPath : dev.path || "/";
        if (!path.startsWith("/") && !path.startsWith(":")) path = "/" + path;
        return path.startsWith(":")
          ? `http://${cleanHost}${path}`
          : `http://${cleanHost}${portPart}${path}`;
      }

      function getDisplayAddress(dev) {
        const host =
          config.settings.preferMdns && dev.mdns
            ? dev.mdns
            : dev.ip || dev.mdns;
        const cleanHost = cleanHostInput(host);
        const portPart =
          dev.port && Number(dev.port) !== 80 ? `:${dev.port}` : "";
        return `${cleanHost}${portPart}`;
      }

      function getGroupName(id) {
        const g = config.groups.find((x) => x.id === id);
        return g ? g.name : "None";
      }

      function copyAddress(e, text) {
        e.stopPropagation();
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(text)
            .then(() => showToast(`Copied: ${text}`))
            .catch(() => fallbackCopyText(text));
        } else {
          fallbackCopyText(text);
        }
      }

      function fallbackCopyText(text) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(`Copied: ${text}`);
        } catch (_) {
          showToast(`Address: ${text}`);
        }
      }

      function hashCredential(username, password) {
        const cleanUser = String(username || "")
          .trim()
          .toLowerCase();
        const raw = `${cleanUser}:${String(password || "")}:${KEY_SALT}`;
        let h1 = 0xdeadbeef ^ raw.length,
          h2 = 0x41c6ce57 ^ raw.length;
        for (let i = 0, ch; i < raw.length; i++) {
          ch = raw.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 =
          Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^
          Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 =
          Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^
          Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (
          "sha:" +
          (h2 >>> 0).toString(16).padStart(8, "0") +
          (h1 >>> 0).toString(16).padStart(8, "0")
        );
      }

      function encodeApiKey(rawKey) {
        const str = String(rawKey || "").trim();
        if (!str || str.startsWith("enc:")) return str;
        const xor = Array.from(str)
          .map((ch, i) =>
            String.fromCharCode(
              ch.charCodeAt(0) ^ KEY_SALT.charCodeAt(i % KEY_SALT.length),
            ),
          )
          .join("");
        return "enc:" + btoa(xor);
      }

      function revealApiKey(storedKey) {
        const str = String(storedKey || "").trim();
        if (!str.startsWith("enc:")) return str;
        try {
          const raw = atob(str.slice(4));
          return Array.from(raw)
            .map((ch, i) =>
              String.fromCharCode(
                ch.charCodeAt(0) ^ KEY_SALT.charCodeAt(i % KEY_SALT.length),
              ),
            )
            .join("");
        } catch {
          return "";
        }
      }

      function maskApiKey(storedKey) {
        const plain = revealApiKey(storedKey);
        if (!plain) return "None";
        const last4 = plain.slice(-4);
        return `••••••••••••${last4}`;
      }

      /* ==========================================================================
         4. CONFIGURATION SANITIZATION & SYNC
         ========================================================================== */
      function getDefaultAdminConfig() {
        return {
          time: {
            ntpServer: "pool.ntp.org",
            format: "24h",
            tzOffset: "5.5",
            tzCountry: "India (UTC+05:30)",
            lastSync: "Never",
          },
          users: [
            {
              username: "esp",
              passHash: hashCredential("esp", "456456"),
              role: "admin",
            },
          ],
          verification: {
            homePage: { mode: "session", role: "all" },
            configPage: { mode: "session", role: "admin" },
            actions: {
              devices: "admin",
              shortcuts: "admin",
              homeToggle: "none",
              groups: "admin",
              favorites: "all",
              network: "admin",
              restart: "admin",
              reset: "admin",
            },
          },
        };
      }

      function syncLegacyFavorites(cfg) {
        cfg.devices.forEach((d) => {
          if (
            d.fav &&
            !cfg.favorites.some(
              (f) =>
                Array.isArray(f.deviceIds) &&
                f.deviceIds.length === 1 &&
                f.deviceIds[0] === d.id &&
                (!f.shortcutIds || !f.shortcutIds.length) &&
                (!f.groupIds || !f.groupIds.length),
            )
          ) {
            cfg.favorites.push({
              id: "fav_d_" + d.id,
              name: d.name,
              icon: d.icon || "chip",
              color: d.color || "#38bdf8",
              deviceIds: [d.id],
              shortcutIds: [],
              groupIds: [],
            });
          }
        });
        cfg.shortcuts.forEach((s) => {
          if (
            s.fav &&
            !cfg.favorites.some(
              (f) =>
                Array.isArray(f.shortcutIds) &&
                f.shortcutIds.length === 1 &&
                f.shortcutIds[0] === s.id &&
                (!f.deviceIds || !f.deviceIds.length) &&
                (!f.groupIds || !f.groupIds.length),
            )
          ) {
            cfg.favorites.push({
              id: "fav_s_" + s.id,
              name: s.name,
              icon: s.icon || "switch",
              color: s.color || "#38bdf8",
              deviceIds: [],
              shortcutIds: [s.id],
              groupIds: [],
            });
          }
        });
      }

      function sanitizeConfig(raw) {
        const base = structuredClone(DEFAULT_CONFIG);
        const defAdmin = getDefaultAdminConfig();
        if (!raw || typeof raw !== "object") {
          base.shortcuts.forEach((s) => {
            if (s.apiKey) s.apiKey = encodeApiKey(s.apiKey);
          });
          base.admin = defAdmin;
          syncLegacyFavorites(base);
          return base;
        }
        const rawAdmin = raw?.admin || {};
        const mergedUsers =
          Array.isArray(rawAdmin.users) && rawAdmin.users.length
            ? rawAdmin.users
            : defAdmin.users;

        if (!mergedUsers.some((u) => u.role === "admin")) {
          mergedUsers.unshift(defAdmin.users[0]);
        }

        const merged = {
          settings: { ...base.settings, ...(raw.settings || {}) },
          network: { ...base.network, ...(raw.network || {}) },
          groups: Array.isArray(raw.groups) ? raw.groups : base.groups,
          devices: Array.isArray(raw.devices) ? raw.devices : base.devices,
          shortcuts: Array.isArray(raw.shortcuts)
            ? raw.shortcuts
            : base.shortcuts,
          favorites: Array.isArray(raw.favorites) ? raw.favorites : [],
          admin: {
            time: { ...defAdmin.time, ...(rawAdmin.time || {}) },
            users: mergedUsers,
            verification: {
              homePage: {
                ...defAdmin.verification.homePage,
                ...(rawAdmin.verification?.homePage || {}),
              },
              configPage: {
                ...defAdmin.verification.configPage,
                ...(rawAdmin.verification?.configPage || {}),
              },
              actions: {
                ...defAdmin.verification.actions,
                ...(rawAdmin.verification?.actions || {}),
              },
            },
          },
        };
        merged.shortcuts.forEach((s) => {
          if (s.apiKey) s.apiKey = encodeApiKey(s.apiKey);
        });
        syncLegacyFavorites(merged);
        return merged;
      }

      /* ==========================================================================
         5. AUTHENTICATION & VERIFICATION SYSTEM
         ========================================================================== */
      function verifyCredentials(username, password, roleRequirement) {
        const uName = String(username || "")
          .trim()
          .toLowerCase();
        const hash = hashCredential(uName, password);
        const user = (config.admin?.users || []).find(
          (u) => u.username.toLowerCase() === uName && u.passHash === hash,
        );
        if (!user) return { ok: false, msg: "Invalid username or password" };
        if (roleRequirement === "admin" && user.role !== "admin") {
          return { ok: false, msg: "Admin role required for this action" };
        }
        if (roleRequirement === "user" && user.role !== "user") {
          return { ok: false, msg: "Normal User role required" };
        }
        return { ok: true, user };
      }

      function promptVerification(roleReq, titleText, allowCancel = true) {
        if (!roleReq || roleReq === "none") return Promise.resolve(true);
        return new Promise((resolve) => {
          requiredAuthRole = roleReq;
          authResolveCallback = resolve;
          const roleLabel =
            roleReq === "admin"
              ? "Admin Only"
              : roleReq === "user"
                ? "Normal User"
                : "Admin or Normal User";
          document.getElementById("authModalTitle").textContent =
            titleText || "Verification Required";
          document.getElementById("authModalSub").textContent =
            `Required permission: ${roleLabel}`;
          document.getElementById("authUser").value = "";
          document.getElementById("authPass").value = "";
          document.getElementById("authCancelBtn").style.display = allowCancel
            ? "inline-flex"
            : "none";
          document.getElementById("forgetBootBox").style.display = "none";
          document.getElementById("authModal").style.display = "flex";
          syncModalScrollLock();
          document.getElementById("authUser").focus();
        });
      }

      function submitAuthModal() {
        const u = document.getElementById("authUser").value;
        const p = document.getElementById("authPass").value;
        const res = verifyCredentials(u, p, requiredAuthRole);
        if (!res.ok) return showToast(res.msg);

        document.getElementById("authModal").style.display = "none";
        syncModalScrollLock();
        if (authResolveCallback) authResolveCallback(res.user);
        authResolveCallback = null;
      }

      function closeAuthModal() {
        clearInterval(forgetBootTimer);
        document.getElementById("authModal").style.display = "none";
        syncModalScrollLock();
        if (authResolveCallback) authResolveCallback(false);
        authResolveCallback = null;
      }

      async function triggerForgetUsers() {
        const box = document.getElementById("forgetBootBox");
        const txt = document.getElementById("forgetBootText");
        const bar = document.getElementById("forgetBootBar");
        box.style.display = "block";

        let remainingMs = 5000;
        clearInterval(forgetBootTimer);

        const bootPromise = !isOfflinePreview
          ? fetch("/api/auth/forget-boot", { method: "POST" })
              .then((r) => r.json())
              .catch(() => ({ bootHeld: false }))
          : new Promise((res) => {
              setTimeout(
                () =>
                  res({
                    bootHeld: confirm(
                      "Preview Mode: Simulate holding ESP32 BOOT button?",
                    ),
                  }),
                1500,
              );
            });

        forgetBootTimer = setInterval(() => {
          remainingMs -= 100;
          const sec = Math.max(0, (remainingMs / 1000).toFixed(1));
          txt.textContent = `Hold ESP32 BOOT button within ${sec}s...`;
          bar.style.width = `${(remainingMs / 5000) * 100}%`;
          if (remainingMs <= 0) clearInterval(forgetBootTimer);
        }, 100);

        const result = await bootPromise;
        clearInterval(forgetBootTimer);

        if (result && result.bootHeld) {
          config.admin.users = [
            {
              username: "esp",
              passHash: hashCredential("esp", "456456"),
              role: "admin",
            },
          ];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
          if (typeof renderAdminPanel === "function") renderAdminPanel();
          box.style.display = "none";
          showToast("Users reset! Default is now esp / 456456");
        } else {
          box.style.display = "none";
          showToast("Forget aborted: BOOT button was not held within 5s");
        }
      }

      async function verifyAction(actionKey, label) {
        const roleReq =
          config.admin?.verification?.actions?.[actionKey] || "none";
        if (roleReq === "none") return true;
        const ok = await promptVerification(roleReq, `Verify: ${label}`, true);
        return !!ok;
      }

      async function enforcePageLogin(pageKey) {
        const policy = config.admin?.verification?.[pageKey] || {
          mode: "session",
          role: "all",
        };
        if (policy.mode === "none") return;

        const sessionKey = `hub_auth_${pageKey}`;
        if (policy.mode === "session") {
          const savedRole = sessionStorage.getItem(sessionKey);
          if (
            savedRole &&
            (policy.role === "all" ||
              savedRole === policy.role ||
              savedRole === "admin")
          ) {
            return;
          }
        }

        const user = await promptVerification(
          policy.role,
          "Login Required - Home",
          false,
        );
        if (user && policy.mode === "session") {
          sessionStorage.setItem(sessionKey, user.role);
        }
      }

      /* ==========================================================================
         6. CLOCK, TELEMETRY & UI PREFERENCES

      function updateHomeClock() {
        const el = document.getElementById("homeClock");
        if (!el || !config?.admin?.time) return;
        const now = new Date();
        const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
        const tzDate = new Date(
          utcMs + Number(config.admin.time.tzOffset || 0) * 3600000,
        );
        const is12h = config.admin.time.format === "12h";
        el.textContent = tzDate.toLocaleTimeString("en-US", {
          hour12: is12h,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

        if (isOfflinePreview) {
          document.getElementById("hubRssi").textContent = formatRssiText(-54);
          document.getElementById("hubUptime").textContent = "Uptime: 3d 14h";

      /* ==========================================================================
         7. PING, SHORTCUT SYNC & DEVICE ACTIONS
         ========================================================================== */
      function isSamePhysicalSwitch(a, b) {
        if (!a || !b) return false;
        const hostA = cleanHostInput(a.host).toLowerCase();
        const hostB = cleanHostInput(b.host).toLowerCase();
        const portA = Number(a.port) || 80;
        const portB = Number(b.port) || 80;
        const idxA = Number(a.index) || 0;
        const idxB = Number(b.index) || 0;
        return hostA === hostB && portA === portB && idxA === idxB;
      }

      async function openDeviceById(id, customPath = null, event = null) {
        if (event) event.stopPropagation();
        if (!(await verifyAction("devices", "Open Device"))) return;
        const dev = config.devices.find((d) => d.id === id);
        if (!dev) return;
        const url = buildTargetUrl(dev, customPath);
        if (url === "#") return showToast("Invalid device address");
        if (config.settings.openNewTab) {
          window.open(url, "_blank", "noopener");
        } else {
          window.location.href = url;
        }
      }

      async function triggerShortcut(id, event) {
        if (!(await verifyAction("homeToggle", "Toggle Shortcut Switch")))
          return;
        if (event) event.stopPropagation();
        const sc = config.shortcuts.find((s) => s.id === id);
        if (!sc || shortcutBusy[id]) return;

        const cleanH = cleanHostInput(sc.host);
        if (!cleanH) return showToast("Invalid shortcut host");
        const portPart = sc.port && Number(sc.port) !== 80 ? `:${sc.port}` : "";
        const url = `http://${cleanH}${portPart}/api/switch/toggle`;
        const rawKey = revealApiKey(sc.apiKey);
        const bodyStr = `index=${encodeURIComponent(sc.index ?? 0)}&state=toggle&key=${encodeURIComponent(rawKey)}`;

        const matchingShortcuts = config.shortcuts.filter((item) =>
          isSamePhysicalSwitch(item, sc),
        );
        matchingShortcuts.forEach((item) => (shortcutBusy[item.id] = true));
        renderAll();

        try {
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: bodyStr,
            cache: "no-store",
          });
          const data = await res.json();

          if (!res.ok || data.ok === false) {
            throw new Error(data.error || `HTTP ${res.status}`);
          }

          const newState = !!data.state;

          matchingShortcuts.forEach((item) => {
            item.state = newState;
            shortcutStatus[item.id] = "online";
          });

          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
          showToast(`${sc.name} is now: ${newState ? "ON" : "OFF"}`);

          syncAllShortcuts(true);
        } catch (err) {
          showToast(err.message || `Failed to toggle ${sc.name}`);
          matchingShortcuts.forEach((item) => {
            shortcutStatus[item.id] = "offline";
          });
        } finally {
          matchingShortcuts.forEach((item) => (shortcutBusy[item.id] = false));
          renderAll();

          const favModal = document.getElementById("favCardModal");
          if (
            favModal.classList.contains("open") &&
            favModal.dataset.activeFavId
          ) {
            handleFavoriteClick(favModal.dataset.activeFavId);
          }
        }
      }

      async function toggleFavorite(e, id) {
        if (!(await verifyAction("favorites", "Modify Favorites"))) return;
        e.stopPropagation();
        const dev = config.devices.find((d) => d.id === id);
        if (!dev) return;
        dev.fav = !dev.fav;

        if (dev.fav) {
          if (
            !config.favorites.some(
              (f) =>
                f.deviceIds?.length === 1 &&
                f.deviceIds[0] === id &&
                !f.shortcutIds?.length &&
                !f.groupIds?.length,
            )
          ) {
            config.favorites.push({
              id: "fav_d_" + id,
              name: dev.name,
              icon: dev.icon || "chip",
              color: dev.color || "#38bdf8",
              deviceIds: [id],
              shortcutIds: [],
              groupIds: [],
            });
          }
        } else {
          config.favorites = config.favorites.filter(
            (f) =>
              !(
                f.deviceIds?.length === 1 &&
                f.deviceIds[0] === id &&
                !f.shortcutIds?.length &&
                !f.groupIds?.length
              ),
          );
        }

        renderAll();
        showToast(dev.fav ? `Pinned ${dev.name}` : `Unpinned ${dev.name}`);

        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        if (!isOfflinePreview) {
          fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(config),
          }).catch(() => {});
        }
      }

      async function pingSingleDevice(dev) {
        deviceStatus[dev.id] = "checking";
        updateStatusIndicators();

        const controller = new AbortController();
        const timeout = setTimeout(
          () => controller.abort(),
          config.settings.pingTimeoutMs || 1500,
        );
        const target = buildTargetUrl(dev, "/");
        const start = performance.now();

        try {
          await fetch(target, {
            mode: "no-cors",
            cache: "no-store",
            signal: controller.signal,
          });
          deviceStatus[dev.id] = "online";
          deviceLatency[dev.id] = Math.max(
            1,
            Math.round(performance.now() - start),
          );
        } catch (err) {
          deviceStatus[dev.id] = "offline";
          deviceLatency[dev.id] = null;
        } finally {
          clearTimeout(timeout);
          updateStatusIndicators();
        }
      }

      async function syncShortcutsForHost(hostKey, silent = false) {
        const group = (config.shortcuts || []).filter((s) => {
          const h = cleanHostInput(s.host).toLowerCase();
          const p = Number(s.port) || 80;
          return `${h}:${p}` === hostKey;
        });
        if (!group.length) return;

        const first = group[0];
        const cleanH = cleanHostInput(first.host);
        const portPart =
          first.port && Number(first.port) !== 80 ? `:${first.port}` : "";

        if (!cleanH) {
          group.forEach((s) => (shortcutStatus[s.id] = "offline"));
          updateStatusIndicators();
          return;
        }

        if (!silent) {
          group.forEach((s) => (shortcutStatus[s.id] = "checking"));
          updateStatusIndicators();
        }

        const controller = new AbortController();
        const timeout = setTimeout(
          () => controller.abort(),
          config.settings.pingTimeoutMs || 1800,
        );

        let stateChanged = false;

        try {
          const res = await fetch(`http://${cleanH}${portPart}/api/switches`, {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          group.forEach((s) => {
            const idx = Number(s.index) || 0;
            if (Array.isArray(data.states) && data.states[idx] !== undefined) {
              const liveState = !!data.states[idx];
              if (s.state !== liveState) {
                s.state = liveState;
                stateChanged = true;
              }
            }
            if (shortcutStatus[s.id] !== "online") {
              shortcutStatus[s.id] = "online";
              stateChanged = true;
            }
          });
        } catch (err) {
          group.forEach((s) => {
            if (shortcutStatus[s.id] !== "offline") {
              shortcutStatus[s.id] = "offline";
              stateChanged = true;
            }
          });
        } finally {
          clearTimeout(timeout);
          if (stateChanged) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
          }
          updateStatusIndicators();
        }
      }

      async function syncAllShortcuts(silent = false) {
        const uniqueHosts = [
          ...new Set(
            (config.shortcuts || [])
              .map((s) => {
                const h = cleanHostInput(s.host).toLowerCase();
                const p = Number(s.port) || 80;
                return h ? `${h}:${p}` : null;
              })
              .filter(Boolean),
          ),
        ];
        await Promise.all(
          uniqueHosts.map((hostKey) => syncShortcutsForHost(hostKey, silent)),
        );
      }

      async function pingAllDevices() {
        const btn = document.getElementById("refreshBtn");
        btn.classList.add("spinning");
        await Promise.all([
          ...config.devices.map((d) => pingSingleDevice(d)),
          syncAllShortcuts(false),
        ]);
        btn.classList.remove("spinning");
      }

      function updateStatusIndicators() {
        const total = config.devices.length;
        const online = config.devices.filter(
          (d) => deviceStatus[d.id] === "online",
        ).length;
        const checking = config.devices.some(
          (d) => deviceStatus[d.id] === "checking",
        );

        document.getElementById("onlineCounter").textContent =
          `${online} / ${total} Online`;

        const summaryDot = document.getElementById("summaryDot");
        if (checking) {
          summaryDot.className = "dot checking";
        } else if (online > 0) {
          summaryDot.className = "dot online";
        } else {
          summaryDot.className = "dot offline";
        }

        config.devices.forEach((dev) => {
          const st = deviceStatus[dev.id] || "checking";
          const ms = deviceLatency[dev.id];
          document
            .querySelectorAll(`[data-status-id="${dev.id}"]`)
            .forEach((dot) => {
              dot.className = `dot ${st}`;
            });
          document
            .querySelectorAll(`[data-ping-id="${dev.id}"]`)
            .forEach((badge) => {
              if (st === "online" && ms) {
                badge.style.display = "inline-block";
                badge.textContent = `${ms}ms`;
              } else {
                badge.style.display = "none";
              }
            });
        });

        (config.shortcuts || []).forEach((sc) => {
          const st = shortcutStatus[sc.id] || "checking";
          const isBusy = !!shortcutBusy[sc.id];
          const isOn = !!sc.state;
          document
            .querySelectorAll(`[data-sc-status-id="${sc.id}"]`)
            .forEach((dot) => {
              dot.className = `dot ${st}`;
              dot.title = `Status: ${st}`;
            });
          document
            .querySelectorAll(`[data-sc-card-id="${sc.id}"]`)
            .forEach((card) => {
              card.classList.toggle("on", isOn);
              card.classList.toggle("busy", isBusy);
              const pill = card.querySelector(".sc-pill");
              if (pill) pill.textContent = isBusy ? "..." : isOn ? "ON" : "OFF";
            });
        });

        (config.favorites || []).forEach((fav) => {
          const dIds = (fav.deviceIds || []).filter((id) =>
            config.devices.some((d) => d.id === id),
          );
          const sIds = (fav.shortcutIds || []).filter((id) =>
            config.shortcuts.some((s) => s.id === id),
          );
          const anyOnline =
            dIds.some((id) => deviceStatus[id] === "online") ||
            sIds.some((id) => shortcutStatus[id] === "online");
          const anyChecking =
            dIds.some(
              (id) => !deviceStatus[id] || deviceStatus[id] === "checking",
            ) ||
            sIds.some(
              (id) => !shortcutStatus[id] || shortcutStatus[id] === "checking",
            );
          const bundleSt = anyOnline
            ? "online"
            : anyChecking
              ? "checking"
              : "offline";

          document
            .querySelectorAll(`[data-fav-bundle-id="${fav.id}"]`)
            .forEach((dot) => {
              dot.className = `dot ${bundleSt}`;
            });
        });
      }

      /* ==========================================================================
         8. UI RENDERING (FAVORITES, SHORTCUTS, DEVICES & MODALS)
         ========================================================================== */
      function createShortcutHtml(sc) {
        const idSafe = escapeHtml(sc.id);
        const colorSafe = escapeHtml(sc.color || "#38bdf8");
        const isBusy = !!shortcutBusy[sc.id];
        const isOn = !!sc.state;
        const st = shortcutStatus[sc.id] || "checking";

        return `
          <div class="shortcut-card ${isOn ? "on" : ""} ${isBusy ? "busy" : ""}" data-sc-card-id="${idSafe}" style="--sc-color:${colorSafe}" onclick="triggerShortcut('${idSafe}', event)">
            <div class="sc-left">
              <div class="sc-icon">${svgIcon(sc.icon || "switch", 19)}</div>
              <div style="min-width:0">
                <div class="sc-title">
                  <span class="dot ${st}" data-sc-status-id="${idSafe}" title="Status: ${st}"></span>
                  <span class="sc-title-text">${escapeHtml(sc.name)}</span>
                </div>
              </div>
            </div>
            <span class="sc-pill">${isBusy ? "..." : isOn ? "ON" : "OFF"}</span>
          </div>
        `;
      }

      function createCardHtml(dev) {
        const st = deviceStatus[dev.id] || "checking";
        const addr = getDisplayAddress(dev);
        const showAddr = config.settings.showIpOnCard !== false;
        const idSafe = escapeHtml(dev.id);
        const altPathSafe = escapeHtml(dev.altPath || "");

        return `
        <article class="card" style="--card-accent:${escapeHtml(dev.color || "var(--accent)")}" onclick="openDeviceById('${idSafe}')">
          <div class="card-top">
            <div class="dev-icon">${svgIcon(dev.icon, 21)}</div>
            <div class="dev-info">
              <div class="dev-title-row">
                <span class="dot ${st}" data-status-id="${idSafe}" title="Status: ${st}"></span>
                <h2 class="dev-name">${escapeHtml(dev.name)}</h2>
              </div>
              <div class="dev-meta">${escapeHtml(dev.note || getGroupName(dev.group))}</div>
            </div>
            <button class="fav-btn ${dev.fav ? "active" : ""}" title="Pin to Favorites" onclick="toggleFavorite(event, '${idSafe}')">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="${dev.fav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </button>
          </div>
          <div class="card-bottom">
            ${showAddr ? `<span class="addr-pill" title="Tap to copy address" onclick="copyAddress(event, '${escapeHtml(addr)}')">${escapeHtml(addr)}</span>` : "<span></span>"}
            <div class="card-links">
              ${dev.altLabel && dev.altPath ? `<button class="mini-btn" onclick="openDeviceById('${idSafe}', '${altPathSafe}', event)">${escapeHtml(dev.altLabel)}</button>` : ""}
            </div>
          </div>
        </article>
      `;
      }

      function renderFavorites() {
        const sec = document.getElementById("favSection");
        const strip = document.getElementById("favStrip");

        if (
          config.settings.enableFavorites === false ||
          !Array.isArray(config.favorites) ||
          !config.favorites.length
        ) {
          sec.style.display = "none";
          return;
        }

        sec.style.display = "block";
        strip.innerHTML = config.favorites
          .map((fav) => {
            const fIdSafe = escapeHtml(fav.id);
            const colorSafe = escapeHtml(fav.color || "#38bdf8");
            const dIds = (fav.deviceIds || []).filter((id) =>
              config.devices.some((d) => d.id === id),
            );
            const sIds = (fav.shortcutIds || []).filter((id) =>
              config.shortcuts.some((s) => s.id === id),
            );
            const gIds = (fav.groupIds || []).filter((id) =>
              config.groups.some((g) => g.id === id),
            );

            // Case 1: Single Shortcut Favorite
            if (sIds.length === 1 && !dIds.length && !gIds.length) {
              const sc = config.shortcuts.find((x) => x.id === sIds[0]);
              const scIdSafe = escapeHtml(sc.id);
              const isBusy = !!shortcutBusy[sc.id];
              const isOn = !!sc.state;
              const st = shortcutStatus[sc.id] || "checking";
              return `
                <div class="shortcut-card ${isOn ? "on" : ""} ${isBusy ? "busy" : ""}" data-sc-card-id="${scIdSafe}" style="--sc-color:${colorSafe}" onclick="handleFavoriteClick('${fIdSafe}')">
                  <div class="sc-left">
                    <div class="sc-icon">${svgIcon(fav.icon || sc.icon || "switch", 19)}</div>
                    <div style="min-width:0">
                      <div class="sc-title">
                        <span class="dot ${st}" data-sc-status-id="${scIdSafe}" title="Status: ${st}"></span>
                        <span class="sc-title-text">${escapeHtml(fav.name || sc.name)}</span>
                      </div>
                    </div>
                  </div>
                  <span class="sc-pill">${isBusy ? "..." : isOn ? "ON" : "OFF"}</span>
                </div>
              `;
            }

            // Case 2: Single Device Favorite
            if (dIds.length === 1 && !sIds.length && !gIds.length) {
              const dev = config.devices.find((x) => x.id === dIds[0]);
              const st = deviceStatus[dev.id] || "checking";
              return `
                <div class="shortcut-card" style="--sc-color:${colorSafe}" onclick="handleFavoriteClick('${fIdSafe}')">
                  <div class="sc-left">
                    <div class="sc-icon">${svgIcon(fav.icon || dev.icon || "chip", 19)}</div>
                    <div style="min-width:0">
                      <div class="sc-title">
                        <span class="dot ${st}" data-status-id="${escapeHtml(dev.id)}" title="Status: ${st}"></span>
                        <span class="sc-title-text">${escapeHtml(fav.name || dev.name)}</span>
                      </div>
                      <div class="sc-sub">${escapeHtml(getDisplayAddress(dev))}</div>
                    </div>
                  </div>
                </div>
              `;
            }

            // Case 3: Group or Multi-Item Favorite Bundle
            const totalItems = dIds.length + sIds.length + gIds.length;
            const anyOnline =
              dIds.some((id) => deviceStatus[id] === "online") ||
              sIds.some((id) => shortcutStatus[id] === "online");
            const anyChecking =
              dIds.some(
                (id) => !deviceStatus[id] || deviceStatus[id] === "checking",
              ) ||
              sIds.some(
                (id) =>
                  !shortcutStatus[id] || shortcutStatus[id] === "checking",
              );
            const bundleSt = anyOnline
              ? "online"
              : anyChecking
                ? "checking"
                : "offline";

            return `
              <div class="shortcut-card" style="--sc-color:${colorSafe}" onclick="handleFavoriteClick('${fIdSafe}')">
                <div class="sc-left">
                  <div class="sc-icon">${svgIcon(fav.icon || "chip", 19)}</div>
                  <div style="min-width:0">
                    <div class="sc-title">
                      <span class="dot ${bundleSt}" data-fav-bundle-id="${fIdSafe}"></span>
                      <span class="sc-title-text">${escapeHtml(fav.name)}</span>
                    </div>
                    <div class="sc-sub">${totalItems} linked item${totalItems > 1 ? "s" : ""}</div>
                  </div>
                </div>
                <span class="sc-pill">OPEN</span>
              </div>
            `;
          })
          .join("");
      }

      function handleFavoriteClick(favId) {
        const fav = config.favorites.find((f) => f.id === favId);
        if (!fav) return;
        const dIds = (fav.deviceIds || []).filter((id) =>
          config.devices.some((d) => d.id === id),
        );
        const sIds = (fav.shortcutIds || []).filter((id) =>
          config.shortcuts.some((s) => s.id === id),
        );
        const gIds = (fav.groupIds || []).filter((id) =>
          config.groups.some((g) => g.id === id),
        );

        if (dIds.length === 1 && !sIds.length && !gIds.length) {
          return openDeviceById(dIds[0]);
        }
        if (sIds.length === 1 && !dIds.length && !gIds.length) {
          return triggerShortcut(sIds[0]);
        }
        if (gIds.length === 1 && !dIds.length && !sIds.length) {
          const el = document.getElementById(`group-block-${gIds[0]}`);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "start" });
            return;
          }
        }

        const modal = document.getElementById("favCardModal");
        document.getElementById("favCardModalTitle").textContent =
          fav.name || "Favorite Card";

        const allDevIds = new Set(dIds);
        const allScIds = new Set(sIds);
        gIds.forEach((gid) => {
          config.devices
            .filter((d) => d.group === gid)
            .forEach((d) => allDevIds.add(d.id));
          config.shortcuts
            .filter((s) => s.group === gid)
            .forEach((s) => allScIds.add(s.id));
        });

        const devs = config.devices.filter((d) => allDevIds.has(d.id));
        const scs = config.shortcuts.filter((s) => allScIds.has(s.id));

        let html = "";
        if (scs.length) {
          html += `<div class="section-label" style="margin-bottom:8px">Shortcut Switches</div>
                   <div class="shortcut-grid" style="margin-bottom:16px">${scs.map(createShortcutHtml).join("")}</div>`;
        }
        if (devs.length) {
          html += `<div class="section-label" style="margin-bottom:8px">Devices</div>
                   <div class="device-grid list-view">${devs.map(createCardHtml).join("")}</div>`;
        }
        if (!html) {
          html = `<p style="color:var(--text-muted);font-size:0.85rem">No linked items in this favorite card.</p>`;
        }

        document.getElementById("favCardModalBody").innerHTML = html;
        modal.dataset.activeFavId = favId;
        modal.classList.add("open");
        syncModalScrollLock();
      }

      function closeFavCardModal() {
        document.getElementById("favCardModal").classList.remove("open");
        syncModalScrollLock();
      }

      function renderShortcuts() {
        const sec = document.getElementById("shortcutSection");
        const grid = document.getElementById("shortcutGrid");
        const query = searchInput.value.trim().toLowerCase();

        if (
          config.settings.enableShortcuts === false ||
          !Array.isArray(config.shortcuts) ||
          !config.shortcuts.length
        ) {
          sec.style.display = "none";
          return;
        }

        const filtered = config.shortcuts.filter((s) => {
          if (!query) return true;
          return (
            (s.name && s.name.toLowerCase().includes(query)) ||
            (s.host && s.host.toLowerCase().includes(query))
          );
        });

        if (!filtered.length) {
          sec.style.display = "none";
          return;
        }

        sec.style.display = "block";
        grid.innerHTML = filtered.map(createShortcutHtml).join("");
      }

      function renderDevices() {
        const container = document.getElementById("devicesContainer");
        const toolbar = document.getElementById("viewToolbar");

        if (config.settings.enableGroups === false) {
          container.innerHTML = "";
          toolbar.style.display = "none";
          return;
        }

        const query = searchInput.value.trim().toLowerCase();

        const visibleDevices = config.devices.filter((d) => {
          if (
            !d.group ||
            d.group === "none" ||
            !config.groups.some((g) => g.id === d.group)
          ) {
            return false;
          }
          if (!query) return true;
          const gName = getGroupName(d.group).toLowerCase();
          return (
            (d.name && d.name.toLowerCase().includes(query)) ||
            (d.ip && d.ip.toLowerCase().includes(query)) ||
            (d.mdns && d.mdns.toLowerCase().includes(query)) ||
            (d.note && d.note.toLowerCase().includes(query)) ||
            gName.includes(query)
          );
        });

        const gridClass = `device-grid ${viewMode === "list" ? "list-view" : ""}`;
        let html = "";

        config.groups.forEach((g) => {
          const groupDevs = visibleDevices.filter((d) => d.group === g.id);
          const groupShortcuts = (config.shortcuts || []).filter(
            (s) =>
              s.group === g.id &&
              (!query ||
                (s.name && s.name.toLowerCase().includes(query)) ||
                (s.host && s.host.toLowerCase().includes(query))),
          );

          if (!groupDevs.length && !groupShortcuts.length) return;
          const totalCount = groupDevs.length + groupShortcuts.length;

          html += `
            <section class="group-block" id="group-block-${escapeHtml(g.id)}">
              <div class="group-header">
                <span class="group-bar" style="background:${escapeHtml(g.color)}"></span>
                <h3 class="group-title">${escapeHtml(g.name)}</h3>
                <span class="tab-count">${totalCount}</span>
              </div>
              ${groupShortcuts.length ? `<div class="shortcut-grid" style="margin-bottom:${groupDevs.length ? "12px" : "0"}">${groupShortcuts.map(createShortcutHtml).join("")}</div>` : ""}
              ${groupDevs.length ? `<div class="${gridClass}">${groupDevs.map(createCardHtml).join("")}</div>` : ""}
            </section>
          `;
        });

        if (!html) {
          toolbar.style.display = "none";
          container.innerHTML = `
          <div class="empty">
            <h3>No grouped devices visible</h3>
            <p>${config.devices.length ? "Assign a device to a Group in NVS Settings (devices set to 'None' stay hidden on Home UI)." : "Add your first ESP32/ESP8266 device in NVS Settings."}</p>
            <a href="config.html" class="btn-primary">+ Manage Devices &amp; Groups</a>
          </div>
        `;
          return;
        }

        toolbar.style.display = "flex";
        container.innerHTML = html;
      }

      function renderAll() {
        renderFavorites();
        renderShortcuts();
        renderDevices();
        updateStatusIndicators();
      }

      /* ==========================================================================
         9. SYSTEM CONTROL & INITIALIZATION
         ========================================================================== */
      async function rebootHub() {
        if (!(await verifyAction("restart", "Restart ESP32 Hub"))) return;
        if (!confirm("Restart the central ESP32 hub now?")) return;
        showToast("Sending restart command...");
        if (!isOfflinePreview) {
          await fetch("/api/reboot", { method: "POST" }).catch(() => {});
        }
        setTimeout(() => location.reload(), 4000);
      }

      async function loadConfig() {
        try {
          const res = await fetch("/api/config", { cache: "no-store" });
          if (!res.ok) throw new Error("No ESP endpoint");
          const remote = await res.json();
          config = sanitizeConfig(remote);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
          isOfflinePreview = false;
        } catch (e) {
          isOfflinePreview = true;
          try {
            const cached = localStorage.getItem(STORAGE_KEY);
            config = cached
              ? sanitizeConfig(JSON.parse(cached))
              : sanitizeConfig(null);
          } catch (_) {
            config = sanitizeConfig(null);
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        }

        applySettingsUI();
        updateHomeClock();
        renderAll();
        await enforcePageLogin("homePage");
        if (config.settings.autoPing) pingAllDevices();
        loadTelemetry();
      }

      /* Event Listeners & Background Intervals */
      searchInput.addEventListener("input", () => {
        clearSearch.style.display = searchInput.value ? "block" : "none";
        renderShortcuts();
        renderDevices();
      });

      clearSearch.addEventListener("click", () => {
        searchInput.value = "";
        clearSearch.style.display = "none";
        renderShortcuts();
        renderDevices();
        searchInput.focus();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === "Escape") {
          closeFavCardModal();
          if (document.activeElement === searchInput) {
            searchInput.value = "";
            clearSearch.style.display = "none";
            renderShortcuts();
            renderDevices();
            searchInput.blur();
          }
        }
      });

      setInterval(updateHomeClock, 1000);

      setInterval(() => {
        if (config && config.shortcuts && config.shortcuts.length) {
          syncAllShortcuts(true);
        }
      }, 2500);

      setInterval(() => {
        if (!isOfflinePreview) loadTelemetry();
      }, 15000);

      loadConfig();
    </script>
  </body>
</html>
