<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>ACCESS POINT</title>
    <style>
      :root {
        --bg: #0b1120;
        --bg-elev: #111827;
        --card: #162033;
        --card-hover: #1d2942;
        --border: #24324d;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.16);
        --ok: #22c55e;
        --err: #ef4444;
        --warn: #f59e0b;
        --star: #fbbf24;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        --radius: 14px;
      }

      [data-theme="amoled"] {
        --bg: #000000;
        --bg-elev: #09090b;
        --card: #121215;
        --card-hover: #1a1a1f;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }

      [data-theme="light"] {
        --bg: #f1f5f9;
        --bg-elev: #ffffff;
        --card: #ffffff;
        --card-hover: #f8fafc;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #0284c7;
        --accent-soft: rgba(2, 132, 199, 0.12);
        --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        line-height: 1.45;
        overflow-x: hidden;
      }

      /* Header */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--bg-elev);
        background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: auto;
        min-width: 0;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .brand h1 {
        font-size: 1.08rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .brand-sub {
        font-size: 0.75rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 0.71rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
      }
      .dot.online {
        background: var(--ok);
        box-shadow: 0 0 8px var(--ok);
      }
      .dot.offline {
        background: var(--err);
      }
      .dot.checking {
        background: var(--warn);
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .seg-toggle {
        display: inline-flex;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 2px;
      }

      .seg-btn {
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.15s;
      }

      .seg-btn.active {
        background: var(--accent);
        color: #031525;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
        text-decoration: none;
        transition: 0.15s;
        flex-shrink: 0;
      }

      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .icon-btn.spinning svg {
        animation: spin 0.8s linear infinite;
      }

      /* Search Bar */
      .search-wrap {
        position: relative;
        flex: 1 1 240px;
        max-width: 340px;
      }

      .search-wrap svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        height: 36px;
        padding: 0 32px 0 34px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 0.85rem;
        outline: none;
        transition: 0.15s;
      }

      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .search-clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
        padding: 4px;
        display: none;
      }

      /* Main Container */
      .container {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
        flex: 1;
      }

      /* === MODIFIED #1: Pinned Favorites Dock (Fixed Upper Glow Clipping) === */
      .fav-section {
        margin-bottom: 18px;
      }

      .section-label {
        font-size: 0.74rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .fav-strip {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        /* Extra top/side/bottom padding so hover lift + glow are never cropped */
        padding: 8px 6px 10px 6px;
        margin: -6px -6px 0 -6px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .fav-strip::-webkit-scrollbar {
        display: none;
      }

      .fav-chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
        font-size: 0.84rem;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          background 0.18s ease,
          box-shadow 0.18s ease;
        flex-shrink: 0;
        user-select: none;
      }

      .fav-chip:hover,
      .fav-chip:focus-visible,
      .fav-chip:active {
        border-color: var(--chip-color, var(--accent));
        background: var(--card-hover);
        transform: translateY(-2px);
        box-shadow:
          0 4px 14px var(--accent-soft),
          0 0 10px
            color-mix(
              in srgb,
              var(--chip-color, var(--accent)) 32%,
              transparent
            );
        outline: none;
      }

      /* Group Filter Bar */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 4px;
        margin: -6px -4px;
        scrollbar-width: none;
        flex: 1;
        -webkit-overflow-scrolling: touch;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-muted);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.15s;
        flex-shrink: 0;
      }

      .tab:hover {
        color: var(--text);
        border-color: var(--text-muted);
      }

      .tab.active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 2px 10px var(--accent-soft);
      }

      .tab-count {
        font-size: 0.7rem;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
      }

      /* Group Section */
      .group-block {
        margin-bottom: 24px;
      }

      .group-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }

      .group-bar {
        width: 4px;
        height: 16px;
        border-radius: 4px;
      }

      .group-title {
        font-size: 0.92rem;
        font-weight: 700;
      }

      /* Device Grid & List */
      .device-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
        gap: 14px;
      }

      .device-grid.list-view {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          background 0.16s ease,
          box-shadow 0.16s ease;
        box-shadow: var(--shadow);
        overflow: hidden;
        cursor: pointer;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--card-accent, var(--accent));
      }

      .card:hover {
        transform: translateY(-2px);
        background: var(--card-hover);
        border-color: var(--card-accent, var(--accent));
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .dev-icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: var(--accent-soft);
        background: color-mix(
          in srgb,
          var(--card-accent, var(--accent)) 15%,
          transparent
        );
        color: var(--card-accent, var(--accent));
      }

      .dev-info {
        flex: 1;
        min-width: 0;
      }

      .dev-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dev-name {
        font-size: 0.96rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ping-ms {
        font-size: 0.68rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ok);
        background: rgba(34, 197, 94, 0.12);
        padding: 1px 6px;
        border-radius: 999px;
        flex-shrink: 0;
      }

      .dev-meta {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .fav-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px;
        margin: -4px -4px 0 0;
        border-radius: 8px;
        display: grid;
        place-items: center;
        transition: 0.15s;
        flex-shrink: 0;
      }

      .fav-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--star);
      }
      .fav-btn.active {
        color: var(--star);
      }

      .card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }

      .addr-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 4px 8px;
        border-radius: 7px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: copy;
        transition: 0.15s;
      }

      .addr-pill:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      .card-links {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        flex-shrink: 0;
      }

      .mini-btn {
        font-size: 0.73rem;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--bg-elev);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
      }

      .mini-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Compact List View Overrides */
      .list-view .card {
        flex-direction: row;
        align-items: center;
        padding: 10px 14px;
      }
      .list-view .card::before {
        width: 3px;
        height: 100%;
        right: auto;
      }
      .list-view .card-top {
        flex: 1;
        align-items: center;
        min-width: 0;
      }
      .list-view .dev-icon {
        width: 36px;
        height: 36px;
      }
      .list-view .card-bottom {
        border-top: none;
        padding-top: 0;
        flex-shrink: 0;
      }

      /* Empty State */
      .empty {
        text-align: center;
        padding: 48px 16px;
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
      }

      .empty h3 {
        color: var(--text);
        margin-bottom: 6px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 14px;
        padding: 9px 16px;
        border-radius: 10px;
        background: var(--accent);
        color: #031525;
        font-weight: 700;
        font-size: 0.85rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }

      /* === MODIFIED #2: Two-Line Footer (Developer Credit + Core Telemetry) === */
      footer {
        border-top: 1px solid var(--border);
        background: var(--bg-elev);
        padding: 14px 16px;
        font-size: 0.76rem;
        color: var(--text-muted);
        margin-top: auto;
      }

      .footer-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
      }

      .footer-credit {
        font-size: 0.8rem;
        color: var(--text);
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .footer-credit strong {
        font-weight: 700;
      }

      .footer-credit .brand-tag {
        color: var(--accent);
        font-weight: 700;
      }

      .footer-telemetry {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.74rem;
        color: var(--text-muted);
      }

      .sep {
        opacity: 0.45;
        user-select: none;
      }

      .footer-link {
        color: var(--accent);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.74rem;
        font-weight: 600;
        text-decoration: underline;
        padding: 2px 4px;
      }
      .footer-link:hover {
        opacity: 0.85;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--text);
        color: var(--bg);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 600;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: 0.25s ease;
        z-index: 100;
        max-width: 92vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* === MODIFIED #3: Enhanced Mobile Responsiveness === */
      @media (max-width: 640px) {
        .topbar-inner {
          padding: 10px 12px;
          gap: 10px;
        }
        .brand h1 {
          font-size: 0.98rem;
        }
        .search-wrap {
          order: 3;
          max-width: 100%;
          flex: 1 1 100%;
        }
        /* 16px prevents iOS/Android auto-zoom when tapping search input */
        .search-input {
          font-size: 16px;
          height: 38px;
        }
        .container {
          padding: 12px;
        }
        .device-grid {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .toolbar {
          gap: 8px;
        }
        .list-view .addr-pill {
          display: none;
        }
        .card {
          padding: 12px;
        }
      }

      @media (max-width: 380px) {
        .brand-sub span#hubSubtitle {
          display: none;
        }
        .seg-btn {
          padding: 5px 8px;
          font-size: 0.72rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-icon">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="4" width="16" height="16" rx="2" />
              <rect x="9" y="9" width="6" height="6" />
              <path
                d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"
              />
            </svg>
          </div>
          <div style="min-width: 0">
            <h1 id="hubTitle">ACCESS POINT</h1>
            <div class="brand-sub">
              <span id="hubSubtitle">ESP32 Central Gateway</span>
              <span class="status-pill">
                <span class="dot checking" id="summaryDot"></span>
                <span id="onlineCounter">0 / 0 Online</span>
              </span>
            </div>
          </div>
        </div>

        <div class="search-wrap">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search devices, IP, mDNS... (/)"
          />
          <button id="clearSearch" class="search-clear" title="Clear">
            &times;
          </button>
        </div>

        <div class="header-actions">
          <div
            class="seg-toggle"
            title="Switch primary address mode (IP vs mDNS)"
          >
            <button
              class="seg-btn active"
              id="modeIpBtn"
              onclick="setAddressMode(false)"
            >
              IP
            </button>
            <button
              class="seg-btn"
              id="modeMdnsBtn"
              onclick="setAddressMode(true)"
            >
              mDNS
            </button>
          </div>

          <button
            class="icon-btn"
            id="refreshBtn"
            title="Ping all devices"
            onclick="pingAllDevices()"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>

          <a
            href="config.html"
            class="icon-btn"
            title="NVS Settings & Device Manager"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </a>

    </header>

    <main class="container">
      <!-- Pinned Favorites Dock -->
      <section class="fav-section" id="favSection" style="display: none">
        <div class="section-label">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="#fbbf24"
            stroke="#fbbf24"
            stroke-width="2"
          >
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
            />
          </svg>
          Pinned Favorites
        </div>
        <div class="fav-strip" id="favStrip"></div>
      </section>

      <!-- Group Tabs & View Controls -->
      <div class="toolbar">
        <div class="tabs" id="groupTabs"></div>
        <div class="seg-toggle" title="Switch layout">
          <button
            class="seg-btn active"
            id="gridViewBtn"
            onclick="setViewMode('grid')"
          >
            Grid
          </button>
          <button
            class="seg-btn"
            id="listViewBtn"
            onclick="setViewMode('list')"
          >
            Compact
          </button>

      <!-- Devices Container -->
      <div id="devicesContainer"></div>
    </main>

    <!-- === MODIFIED #2: Two-Line Footer === -->
    <footer>
      <div class="footer-inner">
        <div class="footer-credit">
          Developer &copy; <strong>M.Maity</strong>
          <span class="sep">|</span>
          <span class="brand-tag">iotBrainStorm</span>
        </div>
        <div class="footer-telemetry">
          <span id="hubRssi">WiFi: -- dBm</span>
          <span class="sep">&bull;</span>
          <span id="hubUptime">Uptime: --</span>
          <span class="sep">&bull;</span>
          <button class="footer-link" onclick="rebootHub()">Restart</button>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
      const STORAGE_KEY = "esp_iot_hub_config_v1";

      const ICONS = {
        chip: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
        led: '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
        matrix:
          '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="8" cy="16" r="1"/><circle cx="12" cy="16" r="1"/><circle cx="16" cy="16" r="1"/>',
        plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
        sensor: '<path d="M2 12h3l2-7 4 14 3-9 2 4h6"/>',
        thermo:
          '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>',
        camera:
          '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
        fan: '<path d="M12 12c0-3 2.5-5 5-5 2.8 0 5 2.2 5 5s-2.2 5-5 5h-5"/><path d="M12 12c3 0 5 2.5 5 5 0 2.8-2.2 5-5 5s-5-2.2-5-5v-5"/><path d="M12 12c0 3-2.5 5-5 5-2.8 0-5-2.2-5-5s2.2-5 5-5h5"/><path d="M12 12c-3 0-5-2.5-5-5 0-2.8 2.2-5 5-5s5 2.2 5 5v5"/>',
        switch:
          '<rect x="1" y="5" width="22" height="14" rx="7"/><circle cx="16" cy="12" r="3"/>',
        audio:
          '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
        weather:
          '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
        router:
          '<rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6.01 18H6"/><path d="M10.01 18H10"/><path d="M15 10v4"/><path d="M17.84 7.17a4 4 0 0 0-5.66 0"/>',
        lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        solar:
          '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
      };

      const DEFAULT_CONFIG = {
        settings: {
          title: "ACCESS POINT",
          subtitle: "ESP32 Central Gateway",
          theme: "dark",
          preferMdns: false,
          openNewTab: false,
          showIpOnCard: true,
          autoPing: true,
          pingTimeoutMs: 1500,
          pin: "",
        },
        groups: [
          { id: "g1", name: "LED & Displays", color: "#38bdf8" },
          { id: "g2", name: "Living Room", color: "#34d399" },
          { id: "g3", name: "Sensors & Power", color: "#f59e0b" },
        ],
        devices: [
          {
            id: "d1",
            name: "ESP LED Studio",
            note: "Desk WS2812B & MAX7219",
            ip: "192.168.1.42",
            mdns: "esp-led-studio.local",
            port: 80,
            path: "/",
            altLabel: "OTA",
            altPath: "/update",
            group: "g1",
            icon: "matrix",
            color: "#38bdf8",
            fav: true,
          },
          {
            id: "d2",
            name: "Bedroom Ambient",
            note: "WLED Strip Controller",
            ip: "192.168.1.45",
            mdns: "bedroom-led.local",
            port: 80,
            path: "/",
            altLabel: "Presets",
            altPath: "/win",
            group: "g1",
            icon: "led",
            color: "#a855f7",
            fav: true,
          },
          {
            id: "d3",
            name: "Main Hall Relay",
            note: "4-Channel Smart Switch",
            ip: "192.168.1.51",
            mdns: "hall-relay.local",
            port: 80,
            path: "/",
            altLabel: "OTA",
            altPath: "/update",
            group: "g2",
            icon: "switch",
            color: "#34d399",
            fav: true,
          },
          {
            id: "d4",
            name: "Weather Station",
            note: "AHT10 & BH1750 Telemetry",
            ip: "192.168.1.60",
            mdns: "env-sensor.local",
            port: 80,
            path: "/",
            altLabel: "JSON",
            altPath: "/api/data",
            group: "g3",
            icon: "weather",
            color: "#f59e0b",
            fav: false,
          },
        ],
      };

      let config = null;
      let activeGroup = "all";
      let viewMode = localStorage.getItem("hub_view_mode") || "grid";
      let deviceStatus = {}; // { [id]: 'online' | 'offline' | 'checking' }
      let deviceLatency = {}; // { [id]: number (ms) }
      let isOfflinePreview = false;

      /* === SAFEGUARD: Deep Config Validator === */
      function sanitizeConfig(raw) {
        const base = structuredClone(DEFAULT_CONFIG);
        if (!raw || typeof raw !== "object") return base;
        return {
          settings: { ...base.settings, ...(raw.settings || {}) },
          groups:
            Array.isArray(raw.groups) && raw.groups.length
              ? raw.groups
              : base.groups,
          devices: Array.isArray(raw.devices) ? raw.devices : base.devices,
        };
      }

      function svgIcon(name, size = 20) {
        const path = ICONS[name] || ICONS.chip;
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("show"), 2200);
      }

      function cleanHostInput(h) {
        return String(h || "")
          .trim()
          .replace(/^https?:\/\//i, "")
          .replace(/\/+$/, "");
      }

      function buildTargetUrl(dev, customPath = null) {
        if (!dev) return "#";
        const host =
          config.settings.preferMdns && dev.mdns
            ? dev.mdns
            : dev.ip || dev.mdns;
        const cleanHost = cleanHostInput(host);
        if (!cleanHost) return "#";
        const portPart =
          dev.port && Number(dev.port) !== 80 ? `:${dev.port}` : "";
        let path = customPath !== null ? customPath : dev.path || "/";
        if (!path.startsWith("/") && !path.startsWith(":")) path = "/" + path;
        return path.startsWith(":")
          ? `http://${cleanHost}${path}`
          : `http://${cleanHost}${portPart}${path}`;
      }

      function getDisplayAddress(dev) {
        const host =
          config.settings.preferMdns && dev.mdns
            ? dev.mdns
            : dev.ip || dev.mdns;
        const cleanHost = cleanHostInput(host);
        const portPart =
          dev.port && Number(dev.port) !== 80 ? `:${dev.port}` : "";
        return `${cleanHost}${portPart}`;
      }

      async function loadConfig() {
        try {
          const res = await fetch("/api/config", { cache: "no-store" });
          if (!res.ok) throw new Error("No ESP endpoint");
          const remote = await res.json();
          config = sanitizeConfig(remote);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
          isOfflinePreview = false;
        } catch (e) {
          isOfflinePreview = true;
          try {
            const cached = localStorage.getItem(STORAGE_KEY);
            config = cached
              ? sanitizeConfig(JSON.parse(cached))
              : structuredClone(DEFAULT_CONFIG);
          } catch (_) {
            config = structuredClone(DEFAULT_CONFIG);
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        }

        applySettingsUI();
        renderAll();
        if (config.settings.autoPing) pingAllDevices();
        loadTelemetry();
      }

      async function loadTelemetry() {
        if (isOfflinePreview) {
          document.getElementById("hubRssi").textContent = "WiFi: -54 dBm";
          document.getElementById("hubUptime").textContent = "Uptime: 3d 14h";
          return;
        }
        try {
          const res = await fetch("/api/status", { cache: "no-store" });
          if (!res.ok) return;
          const data = await res.json();
          if (data.rssi !== undefined)
            document.getElementById("hubRssi").textContent =
              `WiFi: ${data.rssi} dBm`;
          if (data.uptime !== undefined)
            document.getElementById("hubUptime").textContent =
              `Uptime: ${data.uptime}`;
        } catch (_) {}
      }

      function applySettingsUI() {
        const s = config.settings;
        document.documentElement.setAttribute("data-theme", s.theme || "dark");
        document.title = s.title || "ACCESS POINT";
        document.getElementById("hubTitle").textContent =
          s.title || "ACCESS POINT";
        document.getElementById("hubSubtitle").textContent =
          s.subtitle || "ESP32 Central Gateway";
        document
          .getElementById("modeIpBtn")
          .classList.toggle("active", !s.preferMdns);
        document
          .getElementById("modeMdnsBtn")
          .classList.toggle("active", !!s.preferMdns);
        document
          .getElementById("gridViewBtn")
          .classList.toggle("active", viewMode === "grid");
        document
          .getElementById("listViewBtn")
          .classList.toggle("active", viewMode === "list");
      }

      function setAddressMode(useMdns) {
        config.settings.preferMdns = useMdns;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        applySettingsUI();
        renderAll();
        showToast(
          useMdns ? "Switched to mDNS (.local)" : "Switched to IPv4 Addresses",
        );
      }

      function setViewMode(mode) {
        viewMode = mode;
        localStorage.setItem("hub_view_mode", mode);
        applySettingsUI();
        renderDevices();
      }

      /* === SAFEGUARD: Open by ID instead of inline JSON === */
      function openDeviceById(id, customPath = null, event = null) {
        if (event) event.stopPropagation();
        const dev = config.devices.find((d) => d.id === id);
        if (!dev) return;
        const url = buildTargetUrl(dev, customPath);
        if (url === "#") return showToast("Invalid device address");
        if (config.settings.openNewTab) {
          window.open(url, "_blank", "noopener");
        } else {
          window.location.href = url;
        }
      }

      /* === SAFEGUARD: HTTP LAN Clipboard Fallback === */
      function copyAddress(e, text) {
        e.stopPropagation();
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(text)
            .then(() => showToast(`Copied: ${text}`))
            .catch(() => fallbackCopyText(text));
        } else {
          fallbackCopyText(text);
        }
      }

      function fallbackCopyText(text) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(`Copied: ${text}`);
        } catch (_) {
          showToast(`Address: ${text}`);
        }
      }

      async function toggleFavorite(e, id) {
        e.stopPropagation();
        const dev = config.devices.find((d) => d.id === id);
        if (!dev) return;
        dev.fav = !dev.fav;
        renderAll();
        showToast(dev.fav ? `Pinned ${dev.name}` : `Unpinned ${dev.name}`);

        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        if (!isOfflinePreview) {
          fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(config),
          }).catch(() => {});
        }
      }

      async function pingSingleDevice(dev) {
        deviceStatus[dev.id] = "checking";
        updateStatusIndicators();

        const controller = new AbortController();
        const timeout = setTimeout(
          () => controller.abort(),
          config.settings.pingTimeoutMs || 1500,
        );
        const target = buildTargetUrl(dev, "/");
        const start = performance.now();

        try {
          await fetch(target, {
            mode: "no-cors",
            cache: "no-store",
            signal: controller.signal,
          });
          deviceStatus[dev.id] = "online";
          deviceLatency[dev.id] = Math.max(
            1,
            Math.round(performance.now() - start),
          );
        } catch (err) {
          deviceStatus[dev.id] = "offline";
          deviceLatency[dev.id] = null;
        } finally {
          clearTimeout(timeout);
          updateStatusIndicators();
        }
      }

      async function pingAllDevices() {
        const btn = document.getElementById("refreshBtn");
        btn.classList.add("spinning");
        await Promise.all(config.devices.map((d) => pingSingleDevice(d)));
        btn.classList.remove("spinning");
        if (activeGroup === "online") renderDevices();
      }

      function updateStatusIndicators() {
        const total = config.devices.length;
        const online = config.devices.filter(
          (d) => deviceStatus[d.id] === "online",
        ).length;
        const checking = config.devices.some(
          (d) => deviceStatus[d.id] === "checking",
        );

        document.getElementById("onlineCounter").textContent =
          `${online} / ${total} Online`;

        const summaryDot = document.getElementById("summaryDot");
        if (checking) {
          summaryDot.className = "dot checking";
        } else if (online > 0) {
          summaryDot.className = "dot online";
        } else {
          summaryDot.className = "dot offline";
        }

        config.devices.forEach((dev) => {
          const st = deviceStatus[dev.id] || "checking";
          const ms = deviceLatency[dev.id];
          document
            .querySelectorAll(`[data-status-id="${dev.id}"]`)
            .forEach((dot) => {
              dot.className = `dot ${st}`;
            });
          document
            .querySelectorAll(`[data-ping-id="${dev.id}"]`)
            .forEach((badge) => {
              if (st === "online" && ms) {
                badge.style.display = "inline-block";
                badge.textContent = `${ms}ms`;
              } else {
                badge.style.display = "none";
              }
            });
        });
      }

      function renderFavorites() {
        const favs = config.devices.filter((d) => d.fav);
        const sec = document.getElementById("favSection");
        const strip = document.getElementById("favStrip");

        if (!favs.length) {
          sec.style.display = "none";
          return;
        }

        sec.style.display = "block";
        strip.innerHTML = favs
          .map((dev) => {
            const st = deviceStatus[dev.id] || "checking";
            const idSafe = escapeHtml(dev.id);
            const colorSafe = escapeHtml(dev.color || "#38bdf8");
            return `
          <div class="fav-chip" style="--chip-color:${colorSafe}" onclick="openDeviceById('${idSafe}')">
            <span class="dot ${st}" data-status-id="${idSafe}"></span>
            <span style="color:${colorSafe};display:grid">${svgIcon(dev.icon, 16)}</span>
            <span>${escapeHtml(dev.name)}</span>
          </div>
        `;
          })
          .join("");
      }

      function renderTabs() {
        const tabsEl = document.getElementById("groupTabs");
        const allCount = config.devices.length;
        const onlineCount = config.devices.filter(
          (d) => deviceStatus[d.id] === "online",
        ).length;

        let html = `
        <button class="tab ${activeGroup === "all" ? "active" : ""}" onclick="selectGroup('all')">
          All Devices <span class="tab-count">${allCount}</span>
        </button>
        <button class="tab ${activeGroup === "online" ? "active" : ""}" onclick="selectGroup('online')">
          <span class="dot online"></span>
          Online <span class="tab-count">${onlineCount}</span>
        </button>
      `;

        config.groups.forEach((g) => {
          const count = config.devices.filter((d) => d.group === g.id).length;
          const gIdSafe = escapeHtml(g.id);
          html += `
          <button class="tab ${activeGroup === g.id ? "active" : ""}" onclick="selectGroup('${gIdSafe}')">
            <span class="dot" style="background:${escapeHtml(g.color)}"></span>
            ${escapeHtml(g.name)}
            <span class="tab-count">${count}</span>
          </button>
        `;
        });

        tabsEl.innerHTML = html;
      }

      function selectGroup(groupId) {
        activeGroup = groupId;
        renderTabs();
        renderDevices();
      }

      function createCardHtml(dev) {
        const st = deviceStatus[dev.id] || "checking";
        const ms = deviceLatency[dev.id];
        const addr = getDisplayAddress(dev);
        const showAddr = config.settings.showIpOnCard !== false;
        const idSafe = escapeHtml(dev.id);
        const altPathSafe = escapeHtml(dev.altPath || "");

        return `
        <article class="card" style="--card-accent:${escapeHtml(dev.color || "var(--accent)")}" onclick="openDeviceById('${idSafe}')">
          <div class="card-top">
            <div class="dev-icon">${svgIcon(dev.icon, 21)}</div>
            <div class="dev-info">
              <div class="dev-title-row">
                <span class="dot ${st}" data-status-id="${idSafe}" title="Status: ${st}"></span>
                <h2 class="dev-name">${escapeHtml(dev.name)}</h2>
                <span class="ping-ms" data-ping-id="${idSafe}" style="display:${st === "online" && ms ? "inline-block" : "none"}">${ms ? ms + "ms" : ""}</span>
              </div>
              <div class="dev-meta">${escapeHtml(dev.note || getGroupName(dev.group))}</div>
            </div>
            <button class="fav-btn ${dev.fav ? "active" : ""}" title="Pin to Favorites" onclick="toggleFavorite(event, '${idSafe}')">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="${dev.fav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </button>
          </div>
          <div class="card-bottom">
            ${showAddr ? `<span class="addr-pill" title="Tap to copy address" onclick="copyAddress(event, '${escapeHtml(addr)}')">${escapeHtml(addr)}</span>` : "<span></span>"}
            <div class="card-links">
              ${dev.altLabel && dev.altPath ? `<button class="mini-btn" onclick="openDeviceById('${idSafe}', '${altPathSafe}', event)">${escapeHtml(dev.altLabel)}</button>` : ""}
              <button class="mini-btn" onclick="openDeviceById('${idSafe}', null, event)">Open &rarr;</button>
            </div>
          </div>
        </article>
      `;
      }

      function renderDevices() {
        const container = document.getElementById("devicesContainer");
        const query = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();

        const filtered = config.devices.filter((d) => {
          const matchesGroup =
            activeGroup === "all"
              ? true
              : activeGroup === "online"
                ? deviceStatus[d.id] === "online"
                : d.group === activeGroup;
          if (!matchesGroup) return false;
          if (!query) return true;
          const gName = getGroupName(d.group).toLowerCase();
          return (
            (d.name && d.name.toLowerCase().includes(query)) ||
            (d.ip && d.ip.toLowerCase().includes(query)) ||
            (d.mdns && d.mdns.toLowerCase().includes(query)) ||
            (d.note && d.note.toLowerCase().includes(query)) ||
            gName.includes(query)
          );
        });

        if (!filtered.length) {
          container.innerHTML = `
          <div class="empty">
            <h3>No ESP devices found</h3>
            <p>${config.devices.length ? "Try clearing your search or switching group tabs." : "Add your first ESP32/ESP8266 device in NVS Settings."}</p>
            <a href="config.html" class="btn-primary">+ Manage Devices</a>
          </div>
        `;
          return;
        }

        const gridClass = `device-grid ${viewMode === "list" ? "list-view" : ""}`;

        if (activeGroup === "all" && !query && config.groups.length > 1) {
          let html = "";
          config.groups.forEach((g) => {
            const groupDevs = filtered.filter((d) => d.group === g.id);
            if (!groupDevs.length) return;
            html += `
            <section class="group-block">
              <div class="group-header">
                <span class="group-bar" style="background:${escapeHtml(g.color)}"></span>
                <h3 class="group-title">${escapeHtml(g.name)}</h3>
                <span class="tab-count">${groupDevs.length}</span>
              </div>
              <div class="${gridClass}">${groupDevs.map(createCardHtml).join("")}</div>
            </section>
          `;
          });
          const ungrouped = filtered.filter(
            (d) => !config.groups.some((g) => g.id === d.group),
          );
          if (ungrouped.length) {
            html += `
            <section class="group-block">
              <div class="group-header">
                <span class="group-bar" style="background:var(--text-muted)"></span>
                <h3 class="group-title">Other Devices</h3>
              </div>
              <div class="${gridClass}">${ungrouped.map(createCardHtml).join("")}</div>
            </section>
          `;
          }
          container.innerHTML = html;
        } else {
          container.innerHTML = `<div class="${gridClass}">${filtered.map(createCardHtml).join("")}</div>`;
        }
      }

      function renderAll() {
        renderFavorites();
        renderTabs();
        renderDevices();
        updateStatusIndicators();
      }

      function getGroupName(id) {
        const g = config.groups.find((x) => x.id === id);
        return g ? g.name : "General";
      }

      function escapeHtml(str) {
        return String(str || "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }

      async function rebootHub() {
        if (!confirm("Restart the central ESP32 hub now?")) return;
        showToast("Sending restart command...");
        if (!isOfflinePreview) {
          await fetch("/api/reboot", { method: "POST" }).catch(() => {});
        }
        setTimeout(() => location.reload(), 4000);
      }

      // Search & Keyboard Shortcuts
      const searchInput = document.getElementById("searchInput");
      const clearSearch = document.getElementById("clearSearch");

      searchInput.addEventListener("input", () => {
        clearSearch.style.display = searchInput.value ? "block" : "none";
        renderDevices();
      });

      clearSearch.addEventListener("click", () => {
        searchInput.value = "";
        clearSearch.style.display = "none";
        renderDevices();
        searchInput.focus();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (
          e.key === "Escape" &&
          document.activeElement === searchInput
        ) {
          searchInput.value = "";
          clearSearch.style.display = "none";
          renderDevices();
          searchInput.blur();
        }
      });

      // Refresh telemetry every 15s when live
      setInterval(() => {
        if (!isOfflinePreview) loadTelemetry();
      }, 15000);

      loadConfig();
    </script>
  </body>
</html>
